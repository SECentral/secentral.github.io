name: Build and deploy Hugo

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.162.1
      HUGO_ENVIRONMENT: production
    steps:
      - uses: actions/checkout@v4
      - name: Install Hugo
        shell: bash
        run: |
          archive="hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          base="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/$archive" "$base/$archive"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/checksums.txt" "$base/hugo_${HUGO_VERSION}_checksums.txt"
          (cd "$RUNNER_TEMP" && sha256sum --check --ignore-missing checksums.txt)
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" hugo
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Build
        run: hugo --gc --cleanDestinationDir --minify --panicOnWarning
      - name: Check generated site
        run: python3 scripts/check_site.py
      - name: Check progressive enhancements
        run: node --test scripts/site.test.mjs
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
